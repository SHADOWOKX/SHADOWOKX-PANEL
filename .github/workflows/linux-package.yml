name: Linux GNOME package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-package.yml'
      - 'extension.js'
      - 'metadata.json'
      - 'package.json'
      - 'prefs.js'
      - 'stylesheet.css'
      - 'schemas/**'
      - 'icons/**'
      - 'lib/**'
      - 'modules/**'
      - 'services/**'
      - 'ui/**'
      - 'scripts/package.sh'
      - 'scripts/install-linux.sh'
      - 'scripts/validate-json.mjs'
      - 'scripts/validate-release.mjs'
      - 'README.md'
      - 'NOTICE.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/linux-package.yml'
      - 'extension.js'
      - 'metadata.json'
      - 'package.json'
      - 'prefs.js'
      - 'stylesheet.css'
      - 'schemas/**'
      - 'icons/**'
      - 'lib/**'
      - 'modules/**'
      - 'services/**'
      - 'ui/**'
      - 'scripts/package.sh'
      - 'scripts/install-linux.sh'
      - 'scripts/validate-json.mjs'
      - 'scripts/validate-release.mjs'
      - 'README.md'
      - 'NOTICE.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build GNOME Shell 50 extension ZIP
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install GNOME packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gjs gnome-shell libglib2.0-bin unzip zip

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and inspect Linux package
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shadow-panel-package"
          ./scripts/package.sh "$output_dir"
          cp scripts/install-linux.sh "$output_dir/install-linux.sh"
          package="$output_dir/shadow-panel@shadowokx.shell-extension.zip"
          unzip -tq "$package"
          unzip -Z1 "$package" | grep -qx 'modules/codex/costWorker.js'
          unzip -Z1 "$package" | grep -qx 'modules/codex/cost.js'
          (
            cd "$output_dir"
            sha256sum 'shadow-panel@shadowokx.shell-extension.zip' > checksums-linux.txt
          )

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadow-panel-linux-gnome50-v${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/shadow-panel-package/shadow-panel@shadowokx.shell-extension.zip
            ${{ runner.temp }}/shadow-panel-package/checksums-linux.txt
            ${{ runner.temp }}/shadow-panel-package/install-linux.sh
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable Linux release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="linux-v$VERSION"
          output_dir="$RUNNER_TEMP/shadow-panel-package"
          package="$output_dir/shadow-panel@shadowokx.shell-extension.zip"
          checksums="$output_dir/checksums-linux.txt"
          installer="$output_dir/install-linux.sh"
          notes_file="$RUNNER_TEMP/linux-release-notes.md"

          printf '%s\n' \
            "Shadowokx Panel for Linux v$VERSION" \
            "" \
            "- GNOME Shell 50 package for Ubuntu 26.04.1 / Wayland." \
            "- Four animated companions: Robot, Codex Companion, orange Octopus and Penguin; Terminal, Clay and Glacier themes." \
            "- GPT-6.1 Sol pricing fixes missing current-day device estimates; compact daily/weekly account heatmaps remain." \
            "- Today is shown as not reported when the Codex account has not returned a current-day bucket; local session totals are not substituted." \
            "" \
            "Install or update with one command:" \
            '```bash' \
            'curl -fsSL https://github.com/SHADOWOKX/SHADOWOKX-PANEL/releases/download/linux-latest/install-linux.sh | sh' \
            '```' \
            "" \
            "The installer verifies the package SHA-256 before installation. Log out and back in once to load the new version." \
            > "$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$package" "$checksums" "$installer" --clobber
          else
            gh release create "$tag" "$package" "$checksums" "$installer" \
              --target "$GITHUB_SHA" \
              --title "Shadowokx Panel for Linux v$VERSION" \
              --prerelease \
              --latest=false \
              --notes-file "$notes_file"
          fi

          if gh release view linux-latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/linux-latest" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release upload linux-latest "$package" "$checksums" "$installer" --clobber
            gh release edit linux-latest --title "Linux latest · v$VERSION" --notes-file "$notes_file"
          else
            gh release create linux-latest "$package" "$checksums" "$installer" \
              --target "$GITHUB_SHA" --title "Linux latest · v$VERSION" \
              --prerelease --latest=false --notes-file "$notes_file"
          fi
