name: Linux GNOME package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-package.yml'
      - 'extension.js'
      - 'metadata.json'
      - 'package.json'
      - 'prefs.js'
      - 'stylesheet.css'
      - 'schemas/**'
      - 'icons/**'
      - 'lib/**'
      - 'modules/**'
      - 'services/**'
      - 'ui/**'
      - 'scripts/package.sh'
      - 'scripts/validate-json.mjs'
      - 'scripts/validate-release.mjs'
      - 'README.md'
      - 'NOTICE.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/linux-package.yml'
      - 'extension.js'
      - 'metadata.json'
      - 'package.json'
      - 'prefs.js'
      - 'stylesheet.css'
      - 'schemas/**'
      - 'icons/**'
      - 'lib/**'
      - 'modules/**'
      - 'services/**'
      - 'ui/**'
      - 'scripts/package.sh'
      - 'scripts/validate-json.mjs'
      - 'scripts/validate-release.mjs'
      - 'README.md'
      - 'NOTICE.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build GNOME Shell 50 extension ZIP
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install GNOME packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gjs gnome-shell libglib2.0-bin unzip zip

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and inspect Linux package
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shadow-panel-package"
          ./scripts/package.sh "$output_dir"
          package="$output_dir/shadow-panel@shadowokx.shell-extension.zip"
          unzip -tq "$package"
          unzip -Z1 "$package" | grep -qx 'modules/codex/costWorker.js'
          unzip -Z1 "$package" | grep -qx 'modules/codex/cost.js'
          (
            cd "$output_dir"
            sha256sum 'shadow-panel@shadowokx.shell-extension.zip' > checksums-linux.txt
          )

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v7
        with:
          name: shadow-panel-linux-gnome50-v${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/shadow-panel-package/shadow-panel@shadowokx.shell-extension.zip
            ${{ runner.temp }}/shadow-panel-package/checksums-linux.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable Linux release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="linux-v$VERSION"
          output_dir="$RUNNER_TEMP/shadow-panel-package"
          package="$output_dir/shadow-panel@shadowokx.shell-extension.zip"
          checksums="$output_dir/checksums-linux.txt"

          notes="$(cat <<EOF
Shadowokx Panel for Linux v$VERSION

- GNOME Shell 50 package for Ubuntu 26.04.1 / Wayland.
- Includes the latest Codex account token totals, seven-day activity, date handling, and Linux packaging fixes.
- Today is shown as not reported when the Codex account has not returned a current-day bucket; local session totals are not substituted.

Install:
```bash
gnome-extensions install --force ./shadow-panel@shadowokx.shell-extension.zip
gnome-extensions enable shadow-panel@shadowokx
```

Log out and back in once after installation so GNOME Shell reloads the extension.
EOF
)"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$package" "$checksums" --clobber
          else
            gh release create "$tag" "$package" "$checksums" \
              --target "$GITHUB_SHA" \
              --title "Shadowokx Panel for Linux v$VERSION" \
              --prerelease \
              --notes "$notes"
          fi
