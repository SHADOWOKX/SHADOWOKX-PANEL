name: Windows CI

on:
  push:
    branches:
      - windows-port
    paths:
      - windows/**
      - .github/workflows/windows-ci.yml
  pull_request:
    branches:
      - windows-port
    paths:
      - windows/**
      - .github/workflows/windows-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    name: Test and package Windows x64
    runs-on: windows-2025
    steps:
      - name: Check out Windows source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run tests and build release artifacts
        shell: pwsh
        working-directory: windows
        run: .\scripts\release.ps1 -Configuration Release -Runtime win-x64

      - name: Upload temporary review artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ShadowokxPanel-Windows-${{ github.sha }}
          path: |
            windows/artifacts/release/ShadowokxPanel-Setup-x64.exe
            windows/artifacts/release/ShadowokxPanel-Portable-x64.zip
            windows/artifacts/release/checksums.txt
          if-no-files-found: error
          retention-days: 7
