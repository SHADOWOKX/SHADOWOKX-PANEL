name: Apply Linux screenshots

on:
  push:
    branches: [main]
    paths:
      - '.screenshot-payload/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .screenshot-payload/linux-codex.*.b64 | base64 -d > assets/linux-codex.png
          cat .screenshot-payload/linux-weather.*.b64 | base64 -d > assets/linux-weather.png
          cat .screenshot-payload/linux-topbar.*.b64 | base64 -d > assets/linux-topbar.png
          rm -f .screenshot-payload/*.b64

      - name: Commit screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets .screenshot-payload
          git commit -m "docs: replace Linux screenshots"
          git push origin main
